aid: boompop
name: Boompop
description: >-
  Boompop is a corporate event management and planning SaaS platform that helps
  companies organize offsites, conferences, team gatherings, and other business
  events. The platform pairs AI-powered planning tools that generate briefs,
  agendas, and logistics with hotel and vendor sourcing (AI-powered RFPs and rate
  negotiation), guest and RSVP management, itinerary and event websites, budget
  and expense tracking, and 24/7 AI messaging. Tiers range from a free Starter
  plan through a per-event Pro plan to Full Service white-glove planning with a
  dedicated expert. Boompop was named the 7th fastest-growing software company on
  the 2025 Inc. 5000 list. It is SOC 2 certified and GDPR compliant, and offers
  passwordless login plus Google and Microsoft single sign-on. Boompop is backed
  by Wing Venture Capital. Boompop does not currently publish a public API,
  developer portal, or API documentation.
